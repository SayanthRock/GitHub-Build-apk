name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          set -e

          if [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ] || [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECT_DIR=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print -quit | xargs dirname || true)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Gradle Android project found. Add settings.gradle/build.gradle and gradlew to the repository."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle wrapper
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Creating a Gradle wrapper with installed Gradle."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build debug APK and release AAB
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          ./gradlew clean assembleDebug bundleRelease --stacktrace --no-daemon

      - name: Collect build outputs
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          mkdir -p build-outputs/apk build-outputs/aab
          find . -type f -path "*/build/outputs/apk/*/*.apk" -exec cp {} build-outputs/apk/ \;
          find . -type f -path "*/build/outputs/bundle/*/*.aab" -exec cp {} build-outputs/aab/ \;
          echo "APK files:"
          find build-outputs/apk -type f -name "*.apk" -print
          echo "AAB files:"
          find build-outputs/aab -type f -name "*.aab" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.locate.outputs.project_dir }}/build-outputs/apk/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: ${{ steps.locate.outputs.project_dir }}/build-outputs/aab/*.aab
          if-no-files-found: error
